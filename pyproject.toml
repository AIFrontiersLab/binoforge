[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "binoforge"
version = "0.1.0"
description = "Local MCP operations gateway with approval, audit and timeout recovery"
requires-python = ">=3.12"
dependencies = ["mcp>=2.3,<3", "pyyaml>=6"]

[project.scripts]
ops-gateway = "ops_gateway.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
