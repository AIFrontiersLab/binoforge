acceptance:
- Tool discovery uses the MCP client and lists the four simulated tools.
- Restart without approval is denied.
- A timeout still observes one completed restart.
- A second call with the same operation id does not restart again.
- An unresolved running operation escalates.
angle: Discovery does not grant permission to execute a tool.
blocks:
- id: intake
  inputs:
  - CLI request
  name: Request intake
  outputs:
  - validated tool call
- id: policy
  inputs:
  - validated tool call
  name: Policy and approval
  outputs:
  - permit or denial
- id: execution
  inputs:
  - permitted tool call
  name: Execution and recovery
  outputs:
  - verified result or escalation
challenge:
  expected: One restart, a reconciled audit event and no second generation bump.
  extensions:
  - Add a second approver role for restart.
  failure_injection: OPS_MODE=stall
  prerequisites:
  - Python 3.12
  - The mcp package
  reference: src/ops_gateway/reconcile.py polls status and escalates inside a bound.
  starter: starter/ops_gateway/reconcile.py raises StarterGap.
  statement: The restart succeeds, but the client times out before receiving confirmation.
    Decide how to reconcile durable state without issuing a second restart.
components:
- basis: proposed
  block_id: intake
  id: cli_intake
  name: CLI intake
  responsibility: Accept the actor, tool, reason and idempotency key.
- basis: documented
  block_id: intake
  id: mcp_discovery
  name: MCP discovery
  responsibility: List tools from a local MCP server over stdio.
- basis: proposed
  block_id: intake
  id: argument_validator
  name: Argument check
  responsibility: Reject missing or oversized arguments.
- basis: proposed
  block_id: policy
  id: identity_policy
  name: Identity policy
  responsibility: Allow the tool only for a matching role.
- basis: proposed
  block_id: policy
  id: approval_gate
  name: Approval gate
  responsibility: Hold restart until an explicit approval flag is set.
- basis: documented
  block_id: execution
  id: mcp_executor
  name: MCP executor
  responsibility: Call the selected tool with a timeout.
- basis: proposed
  block_id: execution
  id: operation_store
  name: Operation store
  responsibility: Persist operation state before a delayed reply.
- basis: proposed
  block_id: execution
  id: result_verifier
  name: Result check
  responsibility: Confirm service generation and duplicate status.
- basis: proposed
  block_id: execution
  id: recovery
  name: Recovery
  responsibility: Poll status inside a bound and escalate if it stays running.
- basis: proposed
  block_id: execution
  id: audit_log
  name: Audit log
  responsibility: Append permit, timeout, reconcile and escalation events.
decisions:
- basis: proposed
  id: durable_before_delay
  text: The simulated service writes the operation result before the delayed reply.
- basis: proposed
  id: stable_operation_id
  text: The operation id is a hash of the actor, tool and idempotency key.
- basis: proposed
  id: router_note
  text: MOCK design note. This is not live research.
