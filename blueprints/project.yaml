loops:
- exit_condition: status is completed or failed or attempts are exhausted and the
    run escalates
  id: reconcile_loop
  max_attempts: 3
  purpose: Read durable operation status after a timeout.
modes:
  live: optional delay and stall switches for the same local service
  mock: simulated local service with deterministic fixtures
non_goals:
- Exactly-once execution on arbitrary external systems
- Restarting a real production service
- A custom JSON dispatcher labeled as MCP
outputs:
- operation state JSON
- audit JSONL
pattern: mcp_gateway
problem: An operations agent can discover powerful tools, but discovery alone does
  not grant permission to execute them.
scenario: An operations agent can discover a restart tool. The restart must still
  pass identity, policy and approval and a timed out client must reconcile durable
  state.
